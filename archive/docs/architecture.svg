<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">归墟的请求生命周期</title>
  <desc id="arch-desc">用户一句话从界面进入 FastAPI，Agent Loop 判断是否调用工具；工具通过 services 读写 SQLite。写操作先挂起确认，用户回应后从断点续跑。FAISS 是内存派生索引，LLM API 是唯一自动外连。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5d6060"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4d4c48"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3d7dff"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="539" rx="10" fill="#0c0c0b" stroke="#2a2927"/>

  <!-- header -->
  <text x="32" y="28" font-family="'Cascadia Mono','Consolas',monospace" font-size="11.5" letter-spacing="2" fill="#6a6965">REQUEST LIFECYCLE</text>
  <text x="928" y="28" text-anchor="end" font-family="'Cascadia Mono','Consolas',monospace" font-size="10" letter-spacing="1.5" fill="#4d4c48">GUIXU · ARCHITECTURE</text>
  <line x1="32" y1="40" x2="928" y2="40" stroke="#232526"/>

  <!-- left: user / ui / api / confirmation -->
  <rect x="32" y="60" width="190" height="48" rx="8" fill="#111211" stroke="#2f3233"/>
  <text x="48" y="80" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="17" font-weight="700" fill="#f2f1ee">用户</text>
  <text x="48" y="97" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#85847f">一句话 · 一个 Excel</text>

  <rect x="32" y="132" width="190" height="84" rx="8" fill="#111211" stroke="#2f3233"/>
  <text x="48" y="154" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="17" font-weight="700" fill="#f2f1ee">界面</text>
  <text x="48" y="173" font-family="'Cascadia Mono','Consolas',monospace" font-size="11.5" fill="#85847f">Vue 3 · pywebview</text>
  <text x="48" y="190" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="11.5" fill="#85847f">会话 · 确认卡片 · 产物预览</text>

  <rect x="32" y="244" width="190" height="52" rx="8" fill="#111211" stroke="#2f3233"/>
  <text x="48" y="267" font-family="'Cascadia Mono','Consolas',monospace" font-size="13" fill="#f2f1ee">FastAPI + SSE</text>
  <text x="48" y="284" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="11.5" fill="#85847f">REST · 事件流</text>

  <rect x="32" y="324" width="190" height="80" rx="8" fill="#0e1524" stroke="#3d7dff" stroke-opacity="0.55"/>
  <text x="48" y="347" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14" font-weight="700" fill="#6b9dff">确认卡片</text>
  <text x="48" y="367" font-family="'Cascadia Mono','Consolas',monospace" font-size="11" fill="#85847f">pending 落会话</text>
  <text x="48" y="385" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="#85847f">用户回应 → 续跑</text>

  <path d="M127 108 L127 132" stroke="#5d6060" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M127 216 L127 244" stroke="#5d6060" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M127 324 L127 296" stroke="#3d7dff" stroke-width="1.3" stroke-opacity="0.7" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="134" y="310" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="10" fill="#6a6965">回应</text>

  <!-- center: agent loop -->
  <rect x="262" y="170" width="320" height="152" rx="8" fill="#111211" stroke="#3d7dff" stroke-opacity="0.4"/>
  <text x="278" y="188" font-family="'Cascadia Mono','Consolas',monospace" font-size="11" letter-spacing="2" fill="#6a6965">AGENT LOOP</text>

  <rect x="282" y="202" width="100" height="42" rx="6" fill="#17191a" stroke="#2f3233"/>
  <text x="332" y="228" text-anchor="middle" font-family="'Cascadia Mono','Consolas',monospace" font-size="14" fill="#f2f1ee">LLM</text>

  <rect x="414" y="202" width="152" height="42" rx="6" fill="#17191a" stroke="#2f3233"/>
  <text x="490" y="228" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#f2f1ee">工具调用</text>

  <path d="M382 223 L414 223" stroke="#5d6060" stroke-width="1.4" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="278" y="264" font-family="'Cascadia Mono','Consolas',monospace" font-size="11" fill="#4d4c48">messages · tool_calls · 结果回填</text>
  <text x="278" y="284" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="#4d4c48">没有工具调用 → 最终回答</text>

  <path d="M222 270 L262 270" stroke="#5d6060" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>

  <!-- center: tools / services -->
  <rect x="262" y="356" width="320" height="54" rx="8" fill="#111211" stroke="#2f3233"/>
  <text x="278" y="380" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="15" font-weight="700" fill="#f2f1ee">20 个工具</text>
  <text x="278" y="397" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#85847f">读 · 写 · 结构 · 产出</text>

  <rect x="262" y="438" width="320" height="54" rx="8" fill="#111211" stroke="#2f3233"/>
  <text x="278" y="462" font-family="'Cascadia Mono','Consolas',monospace" font-size="14" fill="#f2f1ee">services/ 业务逻辑</text>
  <text x="278" y="479" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#85847f">CRUD · 导入导出 · 报表 · 文档</text>

  <path d="M422 322 L422 356" stroke="#5d6060" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M422 410 L422 438" stroke="#5d6060" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>

  <!-- confirmation: tools suspend back to the card -->
  <path d="M262 383 L242 383 L242 356 L222 356" stroke="#3d7dff" stroke-width="1.3" stroke-opacity="0.8" stroke-dasharray="4 4" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="242" y="402" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="10" fill="#3d7dff">挂起</text>

  <!-- right: external model API -->
  <rect x="654" y="58" width="262" height="46" rx="8" fill="#111211" stroke="#2f3233" stroke-dasharray="4 4"/>
  <text x="670" y="81" font-family="'Cascadia Mono','Consolas',monospace" font-size="14" fill="#f2f1ee">LLM API</text>
  <text x="670" y="99" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#85847f">唯一自动外连 · 你配置的供应商</text>

  <path d="M582 220 L612 220 L612 80 L654 80" stroke="#4d4c48" stroke-width="1.3" stroke-dasharray="4 4" fill="none" marker-end="url(#arrow-dim)"/>
  <text x="604" y="150" transform="rotate(-90 604 150)" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="10" fill="#4d4c48">模型调用</text>

  <!-- right: local data boundary -->
  <rect x="642" y="140" width="286" height="348" rx="10" fill="none" stroke="#2f3233" stroke-dasharray="4 4"/>
  <text x="654" y="158" font-family="'Cascadia Mono','Consolas',monospace" font-size="8.5" letter-spacing="1.5" fill="#4d4c48">LOCAL DATA</text>

  <rect x="654" y="174" width="262" height="46" rx="8" fill="#111211" stroke="#2f3233" stroke-dasharray="4 4"/>
  <text x="670" y="197" font-family="'Cascadia Mono','Consolas',monospace" font-size="14" fill="#f2f1ee">FAISS</text>
  <text x="670" y="215" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#85847f">内存派生索引 · 数据变更后重建</text>

  <rect x="654" y="320" width="262" height="150" rx="8" fill="#111211" stroke="#2f3233"/>
  <text x="670" y="342" font-family="'Cascadia Mono','Consolas',monospace" font-size="11" letter-spacing="2" fill="#3d7dff">SQLITE · 唯一真源</text>
  <text x="670" y="366" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#cfcecb">• 业务表（视图 + 触发器软删）</text>
  <text x="670" y="390" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#85847f">• _gx_audit / 快照</text>
  <text x="670" y="414" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#85847f">• 文档切片 + 向量</text>
  <text x="670" y="452" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="#4d4c48">单文件 · 可备份 · 可回滚</text>

  <path d="M582 465 L654 465" stroke="#5d6060" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <text x="618" y="456" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="10" fill="#6a6965">写入 / 读取</text>

  <path d="M785 320 L785 218" stroke="#4d4c48" stroke-width="1.3" stroke-dasharray="4 4" fill="none" marker-end="url(#arrow-dim)"/>
  <text x="797" y="270" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="10" fill="#4d4c48">派生 / 重建</text>

  <!-- footer -->
  <line x1="32" y1="504" x2="928" y2="504" stroke="#232526"/>
  <text x="32" y="526" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="11.5" fill="#85847f">写操作挂起，确认后续跑 · SQLite 唯一真源 · FAISS 派生可重建 · LLM API 唯一自动外连</text>
  <text x="928" y="526" text-anchor="end" font-family="'Cascadia Mono','Consolas',monospace" font-size="9" letter-spacing="1.5" fill="#4d4c48">GUIXU · DATA PROCESSING AGENT</text>
</svg>
