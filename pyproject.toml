[project]
name = "guixu"
version = "0.1.0"
description = "归墟 · 数据处理 Agent"
readme = "README.md"
authors = [
    { name = "关梓鹤", email = "3401835026@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "openai>=3.11.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "playwright>=1.63.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlglot>=26.0.0",
    "uvicorn>=0.53.0",
]

[project.optional-dependencies]
# 桌面外壳（src/desktop.py）。只有"以应用窗口运行"才需要它 ——
# 跑服务（api.py）不需要，所以不放进主依赖。
#
# 内核走【系统自带】的那一个，不打包：
#   Windows  WebView2（Edge 内核，Win11 预装、Win10 随 Edge 更新分发）
#   macOS    WKWebView（系统自带）
#   Linux    WebKitGTK（多数发行版有）
# 所以这里只需要 pywebview 和它在各平台跟系统内核通话的桥。
# 原来装的是 PySide6（自带 QtWebEngine），600 多 MB —— 而且实测它显示不了 PDF
# （PdfViewerEnabled 枚举存在但渲染空白，那份构建没编进 PDFium）。见 docs/design.md 第六节。
desktop = [
    "pywebview>=5.0",
    "pythonnet>=3.0; sys_platform == 'win32'",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
