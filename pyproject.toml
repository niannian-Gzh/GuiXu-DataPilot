[project]
name = "datapilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "关梓鹤", email = "3401835026@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "openai>=3.11.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "playwright>=1.63.0",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.53.0",
]

[project.scripts]
datapilot = "datapilot:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
