<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataPilot · 数据处理 Agent</title>
<script>
  /* 主题和开机跳过要在样式和模块加载前就定下来，
     否则会先闪一下深色再切到浅色。放在这里当内联脚本，
     是它唯一必须在解析期执行的理由 */
  (function () {
    var t = localStorage.getItem('dp_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', t);
    // 冷启动才播开机动画，刷新回来看过的就跳过
    if (sessionStorage.getItem('dp_booted') === '1') {
      document.documentElement.setAttribute('data-boot', 'skip');
    }
  })();
</script>
<!-- Vue 和 marked 走 CDN：本项目没有构建步骤，走 import 的话
     得先打包或改写成 ESM 版本，不值当。它们先于下面的 module 执行，
     所以 main.js 里能直接用全局的 Vue / marked -->
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!-- CSS 按层叠顺序加载，顺序不可重排：
     末尾 settings.css 里的「统一质感」依赖前面卡片的 background 简写已声明，
     提前加载会被后者的 background 简写重置掉 -->
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/splash.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/chat.css">
<link rel="stylesheet" href="/css/files.css">
<link rel="stylesheet" href="/css/settings.css">
</head>
<body>

<!-- 挂载点。页面结构全部在 js/components/ 里，
     这里保持空壳，是让 index.html 只剩入口职责 -->
<div id="app">
  <!-- main.js 挂载后会清空这里。留着是为了给"服务没起来"一个兜底，
       而不是白屏 -->
  <div id="boot-fallback" style="
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:16px;color:#8b949e;font-size:14px;
    font-family:-apple-system,'Microsoft YaHei',sans-serif;
  ">
    <div>正在启动…</div>
  </div>
</div>

<script type="module">
  // 动态 import 才能捕获加载失败。uvicorn --reload 重启的瞬间，
  // 静态资源会 404，白屏就是那时候出现的
  import('/js/main.js').catch((err) => {
    const el = document.getElementById('boot-fallback');
    if (!el) return;
    el.innerHTML = '';
    const msg = document.createElement('div');
    msg.textContent = '服务正在启动，请稍候…';
    const btn = document.createElement('button');
    btn.textContent = '重新加载';
    btn.style.cssText = 'padding:8px 20px;border:1px solid #4d6bfe;background:transparent;color:#4d6bfe;border-radius:8px;cursor:pointer;font-size:14px;font-family:inherit;';
    btn.onclick = () => location.reload();
    el.appendChild(msg);
    el.appendChild(btn);
    // 2 秒后自动重试一次——多数情况下服务已经起来了
    setTimeout(() => location.reload(), 2000);
  });
</script>
</body>
</html>
