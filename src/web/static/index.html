<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataPilot · 数据处理 Agent</title>
<script>
  (function () {
    var t = localStorage.getItem('dp_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', t);
    // 冷启动才播开机动画，刷新回来看过的就跳过
    if (sessionStorage.getItem('dp_booted') === '1') {
      document.documentElement.setAttribute('data-boot', 'skip');
    }
  })();
</script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!-- CSS 按层叠顺序加载，顺序不可重排：
     末尾 settings.css 里的「统一质感」依赖前面卡片的 background 简写已声明，
     提前加载会被后者的 background 简写重置掉 -->
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/splash.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/chat.css">
<link rel="stylesheet" href="/css/files.css">
<link rel="stylesheet" href="/css/settings.css">
</head>
<body>

<!-- ===================== 开机动画 ===================== -->
<div id="boot">
  <div class="boot-stage">
    <div class="compass">
      <svg viewBox="0 0 48 48">
        <circle class="ticks" cx="24" cy="24" r="20.5" stroke-dasharray="1.6 9.13"></circle>
        <circle class="ring-inner" cx="24" cy="24" r="15.5"></circle>

        <!-- 四个芒尖各有类名，依次点亮的顺序写在 CSS 里 -->
        <g class="rose">
          <path class="tip tip-n" d="M24 5 28.5 24 24 19.5 19.5 24Z"></path>
          <path class="tip tip-s" d="M24 43 28.5 24 24 28.5 19.5 24Z"></path>
          <path class="tip tip-w" d="M5 24 24 19.5 19.5 24 24 28.5Z"></path>
          <path class="tip tip-e" d="M43 24 24 19.5 28.5 24 24 28.5Z"></path>
          <circle class="rose-core" cx="24" cy="24" r="2.2"></circle>
        </g>

        <g class="helm-spin">
          <path class="helm-arc" d="M9.2 32.5A17 17 0 0 1 36.4 10.6"></path>
          <circle class="helm-dot" cx="36.6" cy="10.4" r="2.6"></circle>
        </g>
      </svg>
    </div>

    <div>
      <div class="boot-word">
        <span style="animation-delay:.10s">D</span>
        <span style="animation-delay:.16s">A</span>
        <span style="animation-delay:.22s">T</span>
        <span style="animation-delay:.28s">A</span>
        <span style="animation-delay:.34s">P</span>
        <span style="animation-delay:.40s">I</span>
        <span style="animation-delay:.46s">L</span>
        <span style="animation-delay:.52s">O</span>
        <span style="animation-delay:.58s">T</span>
      </div>
      <div class="boot-sub" style="text-align:center;margin-top:9px">DATA PROCESSING AGENT</div>
    </div>

    <div class="boot-stats" v-cloak id="bootStats">
      <!-- 由 Vue 填充：动画时长 = 真实初始化时长 -->
    </div>

    <div class="boot-line"><i id="bootBar"></i></div>
  </div>
</div>

<!-- ===================== 主应用 ===================== -->
<div id="app" v-cloak>
<div class="shell" v-if="view === 'chat'"
     :class="{'right-open': railOpen, 'left-shut': leftShut}">

  <!-- ---------- 左栏 ---------- -->
  <aside class="col glass" :class="{hidden: leftShut}">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 48 48" fill="none">
          <circle cx="24" cy="24" r="20.5" stroke="currentColor" stroke-width="2.6"
                  stroke-dasharray="1.6 9.13" opacity=".45" transform="rotate(-90 24 24)"></circle>
          <circle cx="24" cy="24" r="15.5" stroke="currentColor" stroke-width=".8" opacity=".14"></circle>
          <path d="M24 5 28.5 24 24 19.5 19.5 24Z" fill="currentColor"></path>
          <path d="M24 43 28.5 24 24 28.5 19.5 24Z" fill="currentColor" opacity=".28"></path>
          <path d="M5 24 24 19.5 19.5 24 24 28.5Z" fill="currentColor" opacity=".5"></path>
          <path d="M43 24 24 19.5 28.5 24 24 28.5Z" fill="currentColor" opacity=".5"></path>
          <path d="M9.2 32.5A17 17 0 0 1 36.4 10.6" stroke="currentColor" stroke-width="1.7"
                stroke-linecap="round" fill="none" opacity=".6"></path>
          <circle cx="36.6" cy="10.4" r="2.6" fill="currentColor"></circle>
          <circle cx="24" cy="24" r="2.2" fill="currentColor"></circle>
        </svg>
      </div>
      <div style="flex:1;min-width:0">
        <div class="brand-name">DataPilot</div>
        <div class="brand-tag">数据处理 Agent</div>
      </div>
    </div>

    <!-- 主视图切换：会话 / 轨迹 -->
    <div class="side-tabs">
      <button :class="{on: leftTab === 'sessions'}" @click="leftTab = 'sessions'">会话</button>
      <button :class="{on: leftTab === 'trace'}" @click="leftTab = 'trace'">
        轨迹{{ allTools.length ? ' · ' + allTools.length : '' }}
      </button>
    </div>

    <button class="new-chat" @click="newSession">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      新对话
    </button>

    <div class="side-scroll">
      <!-- 轨迹模式：按轮次导航 -->
      <template v-if="leftTab === 'trace'">
        <div class="side-label">
          <span>本会话轮次</span>
          <span style="font-family:var(--mono)">{{ roundsWithTools.length }}</span>
        </div>
        <div v-if="!roundsWithTools.length" class="empty-note">
          还没有工具调用<br>
          <span style="font-size:10.5px">执行过程只属于当前这次对话</span>
        </div>
        <button v-for="(r, i) in roundsWithTools" :key="i" class="round-nav"
                @click="scrollToRound(r.roundIndex)">
          <div class="q">{{ r.question }}</div>
          <div class="m">{{ r.tools.length }} 步 · {{ (r.totalMs / 1000).toFixed(1) }}s</div>
        </button>
      </template>

      <!-- 会话模式：会话列表 -->
      <template v-else>
      <div class="side-label">
        <span>会话</span>
        <span style="font-family:var(--mono)">{{ sessions.length }}</span>
      </div>
      <div v-if="!sessions.length" class="empty-note">还没有历史会话</div>
      <button v-for="s in sessions" :key="s.session_id"
              class="sess" :class="{on: s.session_id === sessionId}"
              @click="openSession(s.session_id)">
        <div class="sess-title">{{ s.title }}</div>
        <div class="sess-meta">
          <span>{{ s.message_count }} 条</span>
          <span>{{ shortTime(s.updated_at) }}</span>
        </div>
        <span class="sess-del" :class="{confirming: pendingDelete === s.session_id}"
              @click.stop="removeSession(s.session_id)"
              :title="pendingDelete === s.session_id ? '再点一次即删除' : '删除会话'">
          <template v-if="pendingDelete === s.session_id">确认？</template>
          <svg v-else viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
               stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </span>
      </button>
      </template>
    </div>

    <div style="padding:9px 12px;border-top:1px solid var(--edge-soft);display:flex;gap:6px">
      <button class="btn ghost" @click="goSettings" style="flex:1;justify-content:center">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        设置
      </button>
      <button class="icon-btn" @click="leftShut = true" title="收起侧栏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
    </div>
  </aside>

  <!-- ---------- 中栏 ---------- -->
  <main class="col glass" style="overflow:hidden">
    <div class="chat-head">
      <button v-if="leftShut" class="icon-btn" @click="leftShut = false" title="展开左侧栏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
      <div class="chat-title">
        {{ leftTab === 'trace' ? '执行轨迹' : currentTitle }}
      </div>
      <!-- 只在右栏收起时出现。展开后右栏自己头部就有收起入口，
           这里再留一个「收起右栏」是两个按钮干同一件事 -->
      <button v-if="leftTab === 'sessions' && !railOpen" class="btn"
              @click="toggleRail" title="展开右侧栏（产物）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <line x1="15" y1="3" x2="15" y2="21"></line>
        </svg>
        产物
      </button>
    </div>

    <!-- ---------- 轨迹页：独立视图，占满中栏 ---------- -->
    <div v-if="leftTab === 'trace'" class="trace-page">
      <div class="trace-page-inner">

        <div v-if="!allTools.length" class="empty-note" style="padding:60px 0">
          本次会话还没有工具调用<br>
          <span style="font-size:11px">执行轨迹只属于当前这次对话，换个会话或先问点什么</span>
        </div>

        <template v-else>
          <dl class="trace-summary">
            <div><dt>总步数</dt><dd>{{ allTools.length }}</dd></div>
            <div><dt>工具耗时</dt><dd>{{ (totalToolMs / 1000).toFixed(1) }}s</dd></div>
            <div><dt>成功</dt><dd style="color:var(--ok)">{{ stateCount.ok }}</dd></div>
            <div><dt>失败 / 拒绝</dt>
              <dd :style="{color: (stateCount.err + stateCount.warn) ? 'var(--err)' : null}">
                {{ stateCount.err + stateCount.warn }}
              </dd>
            </div>
          </dl>

          <div v-for="r in roundsWithTools" :key="r.roundIndex"
               class="trace-round" :id="'round-' + r.roundIndex">
            <div class="trace-round-head">
              <span class="no">第 {{ r.roundIndex + 1 }} 轮</span>
              <span class="q">{{ r.question }}</span>
              <span class="m">{{ r.tools.length }} 步 · {{ (r.totalMs / 1000).toFixed(1) }}s</span>
            </div>

            <div v-for="(t, ti) in r.tools" :key="ti" class="trace-step" :class="t.state">
              <div class="step-head" @click="t.open = !t.open">
                <span class="step-name">{{ t.name }}</span>
                <span class="step-arg">{{ toolGist(t) }}</span>
                <span class="step-ms">{{ t.ms != null ? t.ms + 'ms' : '—' }}</span>
                <span class="step-state" :class="t.state">{{ stateLabel(t.state) }}</span>
              </div>

              <div class="step-bar" v-if="t.ms != null">
                <i :style="{ width: Math.max(2, (t.ms / maxToolMs) * 100) + '%' }"
                   :class="t.state"></i>
              </div>

              <div class="step-body" v-if="t.open">
                <dl class="kv" v-if="t.args && Object.keys(t.args).length">
                  <template v-for="(v, k) in t.args" :key="k">
                    <dt>{{ k }}</dt>
                    <dd>{{ fmtVal(v) }}</dd>
                  </template>
                </dl>
                <div class="sql" v-if="t.parsed && t.parsed.sql"
                     v-html="highlightSql(t.parsed.sql)"></div>
                <div class="rawbox" v-if="t.parsed">{{ prettyJson(t.parsed) }}</div>
                <div class="rawbox" v-else-if="t.raw">{{ t.raw }}</div>
                <div class="set-hint" v-else>这一步没有返回内容（等待确认或被中断）</div>
              </div>
            </div>
          </div>
        </template>

      </div>
    </div>

    <!-- ---------- 对话视图 ---------- -->
    <template v-else>
    <div class="chat-body">
    <div class="stream" ref="streamEl">
      <div class="stream-inner">

        <!-- 欢迎屏 -->
        <div v-if="!turns.length && !busy" class="hello">
          <div class="hello-mark">
            <svg viewBox="0 0 48 48" fill="none">
              <defs>
                <!-- 扫掠尾迹：透明起、亮收，头部才是光点 -->
                <linearGradient id="hmSweep" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0%"   stop-color="#6b9dff" stop-opacity="0"></stop>
                  <stop offset="55%"  stop-color="#7ba5ff" stop-opacity=".5"></stop>
                  <stop offset="100%" stop-color="#b8ceff" stop-opacity=".95"></stop>
                </linearGradient>
              </defs>
              <circle class="hm-ticks" cx="24" cy="24" r="20.5"
                      stroke="currentColor" stroke-width="2.6" stroke-dasharray="1.6 9.13"
                      opacity=".42" transform="rotate(-90 24 24)"></circle>
              <circle class="hm-ring" cx="24" cy="24" r="15.5"
                      stroke="currentColor" stroke-width=".8" opacity=".16"></circle>

              <g class="hm-rose">
                <path d="M24 5 28.5 24 24 19.5 19.5 24Z" fill="currentColor"></path>
                <path d="M24 43 28.5 24 24 28.5 19.5 24Z" fill="currentColor" opacity=".28"></path>
                <path d="M5 24 24 19.5 19.5 24 24 28.5Z" fill="currentColor" opacity=".5"></path>
                <path d="M43 24 24 19.5 28.5 24 24 28.5Z" fill="currentColor" opacity=".5"></path>
                <circle cx="24" cy="24" r="2.2" fill="currentColor"></circle>
              </g>

              <!-- 扫描弧：盘面静止，只有这道光在转。罗盘转起来「指向」就没了意义，
                   扫掠才是「工具正在工作」的表达 -->
              <g class="hm-sweep">
                <circle class="hm-sweep-glow" cx="38.76" cy="12.05" r="4.2"
                        fill="currentColor" opacity=".26"></circle>
                <path class="hm-sweep-arc" d="M24 5A19 19 0 0 1 38.76 12.05"
                      stroke="url(#hmSweep)" stroke-width="1.9"
                      stroke-linecap="round" fill="none"></path>
                <circle class="hm-sweep-dot" cx="38.76" cy="12.05" r="1.9"
                        fill="currentColor"></circle>
              </g>
            </svg>
          </div>
          <h2>今天想问点什么？</h2>
          <p>用一句话，处理你的数据</p>
          <div class="hello-chips">
            <button class="chip" v-for="q in samples" :key="q" @click="ask(q)">{{ q }}</button>
          </div>
        </div>

        <!-- 对话轮次 -->
        <div v-for="(t, ti) in turns" :key="ti" class="turn">
          <div class="turn-user" v-if="t.question">
            <div class="bubble">{{ t.question }}</div>
          </div>

          <div class="turn-bot" style="margin-top:12px">
            <div class="avatar">
              <!-- 21px 下刻度环会糊成一团，这里去掉环，只留芒星、航迹弧和落点 -->
              <svg viewBox="0 0 48 48" fill="none">
                <path d="M24 5 28.5 24 24 19.5 19.5 24Z" fill="currentColor"></path>
                <path d="M24 43 28.5 24 24 28.5 19.5 24Z" fill="currentColor" opacity=".28"></path>
                <path d="M5 24 24 19.5 19.5 24 24 28.5Z" fill="currentColor" opacity=".5"></path>
                <path d="M43 24 24 19.5 28.5 24 24 28.5Z" fill="currentColor" opacity=".5"></path>
                <path d="M9.2 32.5A17 17 0 0 1 36.4 10.6" stroke="currentColor" stroke-width="2.8"
                      stroke-linecap="round" fill="none" opacity=".6"></path>
                <circle cx="36.6" cy="10.4" r="3.4" fill="currentColor"></circle>
                <circle cx="24" cy="24" r="2.4" fill="currentColor"></circle>
              </svg>
            </div>
            <div class="turn-body">

              <!-- 阶段提示 -->
              <div v-if="t.stage" class="stage" :class="{run: busy}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 12a9 9 0 1 1-6.22-8.56"></path>
                </svg>
                {{ t.stage }}
              </div>

              <!-- 思考与工具共用一条时间线。
                   它们本来就是先后发生的，按 SSE 到达顺序排就够了，
                   不必再按轮次重组——重组反而要处理历史会话缺 round 的情况 -->
              <template v-for="(tool, i) in t.tools" :key="i">

              <!-- 思考气泡（模型的思维链） -->
              <div v-if="tool.kind === 'think'" class="think"
                   :class="{open: tool.open}">
                <button class="think-head" @click="tool.open = !tool.open">
                  <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                       stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                  </svg>
                  <span class="think-label">{{ tool.round ? '思考 · 第 ' + tool.round + ' 轮' : '思考' }}</span>
                  <span class="think-gist">{{ thinkGist(tool.text) }}</span>
                </button>
                <div class="think-body" v-if="tool.open">{{ tool.text }}</div>
              </div>

              <!-- 工具调用 -->
              <div v-else class="tool" :class="{open: tool.open}">
                <button class="tool-head" @click="tool.open = !tool.open">
                  <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                       stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                  </svg>
                  <span class="tool-name">{{ tool.name }}</span>
                  <span class="tool-gist">{{ toolGist(tool) }}</span>
                  <span class="tool-time" v-if="tool.ms != null">{{ tool.ms }}ms</span>
                  <span class="tool-dot" :class="tool.state">
                    <svg v-if="tool.state === 'ok'" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="3.4" stroke-linecap="round"
                         stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    <svg v-else-if="tool.state === 'err'" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="3.4" stroke-linecap="round"
                         stroke-linejoin="round">
                      <line x1="18" y1="6" x2="6" y2="18"></line>
                      <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                    <svg v-else-if="tool.state === 'warn'" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="3" stroke-linecap="round"
                         stroke-linejoin="round">
                      <line x1="12" y1="8" x2="12" y2="13"></line>
                      <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                    <svg v-else-if="tool.state === 'wait'" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="3" stroke-linecap="round"
                         stroke-linejoin="round">
                      <line x1="9" y1="7" x2="9" y2="17"></line>
                      <line x1="15" y1="7" x2="15" y2="17"></line>
                    </svg>
                    <svg v-else-if="tool.state === 'cancel'" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="3.2" stroke-linecap="round"
                         stroke-linejoin="round">
                      <line x1="7" y1="12" x2="17" y2="12"></line>
                    </svg>
                  </span>
                </button>

                <div class="tool-body" v-if="tool.open">
                  <dl class="kv" v-if="tool.args && Object.keys(tool.args).length">
                    <template v-for="(v, k) in tool.args" :key="k">
                      <dt>{{ k }}</dt>
                      <dd>{{ fmtVal(v) }}</dd>
                    </template>
                  </dl>

                  <div class="sql" v-if="tool.parsed && tool.parsed.sql"
                       v-html="highlightSql(tool.parsed.sql)"></div>

                  <div class="rawbox" v-if="tool.parsed">{{ prettyJson(tool.parsed) }}</div>
                  <div class="rawbox" v-else-if="tool.raw">{{ tool.raw }}</div>
                </div>
              </div>

              </template>

              <!-- 确认卡片 -->
              <div v-if="t.confirm" class="confirm" :class="{resolved: t.confirm.resolved}">
                <div class="confirm-head">
                  <span class="dot">
                    <svg v-if="!t.confirm.resolved" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
                         stroke-linejoin="round">
                      <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                      <line x1="12" y1="9" x2="12" y2="13"></line>
                      <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                    <svg v-else viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                  </span>
                  {{ confirmTitle(t.confirm) }}
                  <span class="tag">{{ t.confirm.scope }}</span>
                </div>

                <div class="confirm-body">
                  <!-- 候选清单 -->
                  <div class="cands" v-if="t.confirm.rows && t.confirm.rows.length">
                    <table>
                      <thead>
                        <tr><th v-for="c in confirmColumns(t.confirm)" :key="c">{{ c }}</th></tr>
                      </thead>
                      <tbody>
                        <tr v-for="(r, ri) in t.confirm.rows" :key="ri">
                          <td v-for="c in confirmColumns(t.confirm)" :key="c">{{ r[c] ?? '—' }}</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>

                  <!-- 改写对照 -->
                  <div v-if="t.confirm.diffs && t.confirm.diffs.length" style="margin-top:10px">
                    <div class="diff-row" v-for="(d, di) in t.confirm.diffs" :key="di">
                      <div class="diff-field">{{ d.field }}</div>
                      <div class="diff-vals">
                        <span class="diff-from">{{ d.from ?? '空' }}</span>
                        <span class="diff-arrow">→</span>
                        <span class="diff-to">{{ d.to }}</span>
                      </div>
                    </div>
                  </div>

                  <div class="confirm-note" v-if="t.confirm.note">{{ t.confirm.note }}</div>

                  <div class="confirm-actions" v-if="!t.confirm.resolved">
                    <button class="btn" @click="answerConfirm(ti, '取消')"
                            :disabled="busy">取消</button>
                    <button class="btn" :class="t.confirm.danger ? 'danger' : 'primary'"
                            @click="answerConfirm(ti, t.confirm.verb)"
                            :disabled="busy">
                      {{ t.confirm.verb }}
                    </button>
                  </div>
                </div>

                <div class="confirm-verdict" v-if="t.confirm.resolved">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                       stroke-linecap="round" stroke-linejoin="round"
                       style="width:13px;height:13px">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                  {{ t.confirm.verdict }}
                </div>
              </div>

              <!-- 产物卡片 -->
              <div v-for="(a, ai) in t.artifacts" :key="'a' + ai" class="artifact">
                <div class="artifact-icon" :class="a.kind">
                  <svg v-if="a.kind === 'xlsx'" viewBox="0 0 24 24" fill="none"
                       stroke="currentColor" stroke-width="2" stroke-linecap="round"
                       stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="9" y1="13" x2="15" y2="13"></line>
                    <line x1="9" y1="17" x2="15" y2="17"></line>
                  </svg>
                  <svg v-else viewBox="0 0 24 24" fill="none" stroke="currentColor"
                       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <path d="M9 15h6"></path>
                    <path d="M9 18h3"></path>
                  </svg>
                </div>
                <div class="artifact-meta">
                  <div class="artifact-name">{{ a.name }}</div>
                  <div class="artifact-sub">
                    <span v-if="a.rows != null">{{ a.rows }} 条记录</span>
                    <span v-if="a.rows != null"> · </span>
                    <span>{{ a.label }}</span>
                  </div>
                </div>
                <div class="artifact-acts">
                  <button class="btn" @click="previewFile(a)">预览</button>
                  <button class="btn" @click="download(a.path, a.name)">下载</button>
                </div>
              </div>

              <!-- 回答（确认卡片的结论已在卡片里，不再重复一遍） -->
              <div class="prose" v-if="t.answer && !(t.confirm && t.confirm.resolved)"
                   v-html="md(t.answer)"></div>

              <!-- 等待中 -->
              <div v-if="ti === turns.length - 1 && busy && !t.answer" class="thinking">
                <i></i><i></i><i></i>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- 预览：在对话区里分屏，不弹浮层。
         核对表格时往往正需要看着旁边的对话，浮层会把它盖掉 -->
    <aside class="split-view" v-if="viewer">
      <div class="split-head">
        <span class="split-name">{{ viewer.name }}</span>
        <button class="btn" @click="download(viewer.path, viewer.name)">下载</button>
        <button class="icon-btn" @click="viewer = null" title="关闭预览">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
               stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="split-body">
        <template v-if="viewer.kind === 'xlsx'">
          <table class="split-table">
            <thead>
              <tr><th v-for="c in viewer.columns" :key="c">{{ c }}</th></tr>
            </thead>
            <tbody>
              <tr v-for="(row, i) in viewer.rows" :key="i">
                <td v-for="(cell, j) in row" :key="j">{{ cell }}</td>
              </tr>
            </tbody>
          </table>
          <div class="split-note" v-if="viewer.total > viewer.rows.length">
            显示前 {{ viewer.rows.length }} 行，共 {{ viewer.total }} 行
          </div>
        </template>

        <iframe v-else-if="viewer.kind === 'pdf'" class="split-frame" :src="viewer.url"></iframe>

        <div v-else class="split-note" style="margin:auto;text-align:center;line-height:2">
          这种格式没法在这里预览<br>
          <button class="btn" style="margin-top:6px"
                  @click="download(viewer.path, viewer.name)">下载查看</button>
        </div>
      </div>
    </aside>
    </div>

    <div class="composer">
      <div class="composer-inner" :class="{drop: dragging}"
           @dragover.prevent="dragging = true"
           @dragleave="dragLeave"
           @drop.prevent="onDrop">
        <div class="composer-row">
          <button class="upload-btn" @click="triggerUpload" :disabled="busy"
                  title="上传 Excel 文件">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
            </svg>
          </button>
          <input type="file" ref="fileInput" accept=".xlsx,.xls"
                 style="display:none" @change="handleFileSelect">

          <textarea ref="inputEl" v-model="input" rows="1"
                    :disabled="busy"
                    :placeholder="busy ? '正在处理…' : '问点什么，或把 Excel 拖进来'"
                    @keydown.enter.exact.prevent="send"
                    @input="autoGrow"></textarea>
          <button class="send" @click="send" :disabled="busy || !input.trim()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 2 11 13"></path>
              <path d="M22 2 15 22 11 13 2 9z"></path>
            </svg>
          </button>
        </div>
        <div class="composer-foot">
          <span><kbd>Enter</kbd> 发送 · <kbd>Shift</kbd>+<kbd>Enter</kbd> 换行</span>
          <span class="spacer"></span>
          <span v-if="lastElapsed != null">上轮 {{ lastElapsed }}ms</span>
        </div>
      </div>
    </div>
    </template>
  </main>

  <!-- ---------- 右栏：只剩产物。轨迹已经搬到左栏的独立页 ---------- -->
  <aside class="col glass" :class="{hidden: !railOpen}">
    <div class="rail-head">
      <button class="tab" :class="{on: rail === 'artifacts'}" @click="rail = 'artifacts'">
        产物 <b>{{ allArtifacts.length }}</b>
      </button>
      <span style="flex:1"></span>
      <button class="icon-btn" @click="toggleRail" title="收起右侧栏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>

    <div class="rail-body">
      <!-- 产物 —— 本次对话产出的文件。不进全局列表：
           产物和「哪一轮对话、基于什么条件导出的」绑在一起才有意义 -->
      <template v-if="rail === 'artifacts'">
        <div v-if="!allArtifacts.length" class="empty-note">
          本次会话还没有产出文件<br>
          <span style="font-size:10.5px">试试「把已下证的项目导成 Excel」</span>
        </div>
        <div v-for="(a, i) in allArtifacts" :key="i" class="rail-item">
          <div class="rail-item-top">
            <span class="artifact-icon" :class="a.kind"
                  style="width:24px;height:24px;border-radius:7px">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
              </svg>
            </span>
            <span class="name">{{ a.name }}</span>
          </div>
          <div class="rail-item-sub">
            <span>{{ a.label }}</span>
            <span v-if="a.rows != null">{{ a.rows }} 条</span>
          </div>
          <div class="rail-acts">
            <button class="btn" @click="previewFile(a)">预览</button>
            <button class="btn" @click="download(a.path, a.name)">下载</button>
          </div>
        </div>
      </template>
    </div>
  </aside>
</div>

<!-- ---------- 设置：独立页面 ---------- -->
<div v-else class="settings-page">
  <div class="glass" style="flex:1;min-height:0;display:flex;flex-direction:column">

    <div class="set-head">
      <button class="icon-btn" @click="goChat" title="返回对话">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <h2>设置</h2>
      <span class="count" v-if="dirtyCount">{{ dirtyCount }} 项未保存</span>
      <span class="spacer"></span>
      <span class="set-msg" v-if="saveMsg" :class="saveMsg.ok ? 'ok' : 'err'">
        {{ saveMsg.text }}
      </span>
      <button class="btn" v-if="dirtyCount" @click="discardDraft">放弃改动</button>
      <button class="btn primary" @click="saveSettings"
              :disabled="!dirtyCount || saving">
        {{ saving ? '保存中…' : '保存' }}
      </button>
    </div>

    <div class="set-body">
      <nav class="set-nav">
        <button v-for="g in allGroups" :key="g.id"
                :class="{on: activeGroup === g.id}" @click="activeGroup = g.id">
          {{ g.name }}
          <b v-if="groupDirty(g.id)">{{ groupDirty(g.id) }}</b>
        </button>

        <label class="set-adv" :class="{on: advanced}">
          <input type="checkbox" v-model="advanced">
          高级模式
        </label>
      </nav>

      <div class="set-form">
        <div class="set-form-inner">

          <!-- 外观（前端本地，不走后端） -->
          <template v-if="activeGroup === 'appearance'">
            <div class="set-group-title">外观</div>
            <div class="set-field">
              <div class="set-field-top"><span class="name">主题</span></div>
              <div class="seg">
                <button :class="{on: theme === 'dark'}"  @click="setTheme('dark')">深色</button>
                <button :class="{on: theme === 'light'}" @click="setTheme('light')">浅色</button>
              </div>
              <div class="set-hint" style="margin-top:8px">
                深色底压得低，罗盘的辉光和扫描弧才跳得出来
              </div>
            </div>
          </template>

          <!-- 后端参数组 -->
          <template v-else-if="activeGroupParams.length">
            <div class="set-group-title">{{ activeGroupDesc }}</div>

            <div v-for="p in activeGroupParams" :key="p.key" class="set-field">
              <div class="set-field-top">
                <span class="name">{{ p.label }}</span>
                <span class="mark" v-if="dirty(p.key)">未保存</span>
                <!-- 密码类的「值」是掩码，跟默认值比必然不等，
                     别据此报「已改」，也别给它「恢复默认」——那是清空 key -->
                <span class="mark" v-else-if="!p.is_default && p.type !== 'password'"
                      style="background:rgba(134,142,156,0.16);color:var(--fg-dim)">已改</span>
                <span class="spacer"></span>
                <button class="reset"
                        v-if="p.type !== 'password' && (!p.is_default || dirty(p.key))"
                        @click="resetField(p)">恢复默认</button>
              </div>

              <!-- 高级项默认锁着，当前值照常可见 -->
              <div v-if="p.level === 'advanced' && !advanced" class="set-locked">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                {{ p.value }}
              </div>

              <input v-else class="set-input"
                     :type="p.type === 'password' ? 'password'
                            : (p.type === 'number' ? 'number' : 'text')"
                     :value="editValue(p)"
                     :placeholder="p.type === 'password' ? (p.value || '未设置') : ''"
                     @input="onEdit(p, $event.target.value)">

              <div class="set-hint">{{ p.hint }}</div>

              <div class="set-risk" v-if="p.risk && advanced">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                  <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                  <line x1="12" y1="9" x2="12" y2="13"></line>
                  <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
                <span>{{ p.risk }}</span>
              </div>
            </div>
          </template>

          <!-- 只读信息 -->
          <template v-else-if="activeGroup === 'info'">
            <div class="set-group-title">只读信息</div>
            <dl style="margin:0">
              <div class="info-row" v-for="(v, k) in settings.info" :key="k">
                <dt>{{ k }}</dt>
                <dd>{{ v === null ? '—' : v }}</dd>
              </div>
            </dl>
            <div class="set-hint" style="margin-top:14px">
              这些不是偏好设置。数据库路径改错会让 DuckDB 静默新建一个空库，
              看起来像数据全丢了——所以只给看不给改。
            </div>
          </template>

          <!-- 维护 -->
          <template v-else>
            <div class="set-group-title">维护</div>

            <div class="set-field">
              <div class="set-field-top"><span class="name">导出与报告文件</span></div>
              <div class="set-hint">
                data/exports 与 data/reports 下的全部文件
                <span v-if="fileCount !== null"> · 共 <b>{{ fileCount }}</b> 个</span>
              </div>

              <div v-if="confirmKind === 'files'" class="confirm-inline">
                <span class="warn">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                       stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                    <line x1="12" y1="9" x2="12" y2="13"></line>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                  </svg>
                  <span>将永久删除 <b>{{ fileCount ?? '全部' }}</b> 个文件，不可撤销</span>
                </span>
                <button class="btn" @click="confirmKind = null">取消</button>
                <button class="btn danger" @click="doClearFiles">确认删除</button>
              </div>

              <button v-else class="btn danger" style="margin-top:9px"
                      @click="confirmKind = 'files'">清空所有文件</button>
            </div>

            <div class="set-field">
              <div class="set-field-top"><span class="name">历史会话</span></div>
              <div class="set-hint">
                logs/sessions 下的全部会话记录
                <span v-if="sessions.length"> · 共 <b>{{ sessions.length }}</b> 个</span>
              </div>

              <div v-if="confirmKind === 'sessions'" class="confirm-inline">
                <span class="warn">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                       stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                    <line x1="12" y1="9" x2="12" y2="13"></line>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                  </svg>
                  <span>将永久删除 <b>{{ sessions.length }}</b> 个会话，含全部对话记录</span>
                </span>
                <button class="btn" @click="confirmKind = null">取消</button>
                <button class="btn danger" @click="doClearSessions">确认删除</button>
              </div>

              <button v-else class="btn danger" style="margin-top:9px"
                      @click="confirmKind = 'sessions'">删除全部会话</button>
            </div>

            <div class="set-hint" style="margin-top:18px">
              这两项都是不可撤销的。清空后文件与对话记录不会进回收站
              —— 回收站管的是数据库里的项目记录，不是这里。
            </div>
          </template>

        </div>
      </div>
    </div>
  </div>
</div>

<!-- ---------- 全局提示条 ---------- -->
<div v-if="toast" class="toast" :class="toast.ok ? 'ok' : 'err'">
  <svg v-if="toast.ok" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="20 6 9 17 4 12"></polyline>
  </svg>
  <svg v-else viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"></circle>
    <line x1="12" y1="8" x2="12" y2="12"></line>
    <line x1="12" y1="16" x2="12.01" y2="16"></line>
  </svg>
  {{ toast.text }}
</div>
</div>

<script>
const { createApp, ref, computed, watch, onMounted, nextTick } = Vue;
const API = '';

const FIELD_LABELS = {
  project_name: '项目名称', owner: '负责人', category: '分类',
  status_raw: '状态', issued_date: '下发时间', certified_date: '下证时间',
  resubmit_name: '重提项目名', reject_date: '打回时间',
  resubmit_date: '重提时间', reject_count: '打回次数',
};

const SQL_WORDS = [
  'SELECT', 'FROM', 'WHERE', 'AND', 'OR', 'NOT', 'IN', 'LIKE', 'ORDER', 'BY',
  'GROUP', 'HAVING', 'LIMIT', 'COUNT', 'SUM', 'AVG', 'MAX', 'MIN', 'AS',
  'JOIN', 'LEFT', 'RIGHT', 'INNER', 'ON', 'DESC', 'ASC', 'IS', 'NULL',
  'TRUE', 'FALSE', 'BETWEEN', 'DISTINCT', 'CAST', 'CASE', 'WHEN', 'THEN',
  'ELSE', 'END', 'INTERVAL', 'TIMESTAMP', 'CURRENT_DATE',
];

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

createApp({
  setup() {
    /* ---------------- 状态 ---------------- */
    const turns = ref([]);
    const input = ref('');
    const busy = ref(false);
    const sessionId = ref(localStorage.getItem('dp_session') || '');
    const sessions = ref([]);
    const rail = ref('artifacts');
    // 默认展开，三栏结构一眼可见；用户收起过才记住收起
    const railOpen = ref(localStorage.getItem('dp_rail') !== '0');
    const leftShut = ref(false);
    const theme = ref(localStorage.getItem('dp_theme') || 'dark');
    const viewer = ref(null);

    /* ---------------- 设置 ---------------- */
    const view = ref('chat');              // 'chat' | 'settings'
    const settings = ref({ groups: [], params: [], info: {} });
    const activeGroup = ref('llm');
    const leftTab = ref('sessions');        // 'sessions' | 'trace'
    const draft = ref({});                 // 只存改过的项：key -> 新值
    const advanced = ref(localStorage.getItem('dp_advanced') === '1');
    const saving = ref(false);
    const saveMsg = ref(null);

    // 前端本地的两组，不走后端 API
    const LOCAL_GROUPS = [
      { id: 'appearance', name: '外观', local: true },
      { id: 'info',       name: '只读信息', local: true },
      { id: 'maintain',   name: '维护', local: true },
    ];
    const dragging = ref(false);
    const fileInput = ref(null);
    const lastElapsed = ref(null);
    const streamEl = ref(null);

    // 领域无关的引导语，从查 → 改 → 导出 → 检查 → 报告，由简到繁
    const samples = [
      '这张表里有多少条记录',
      '把某条记录的状态改一下',
      '把所有数据导出成 Excel',
      '看看数据有没有问题',
      '给我一份本周报告',
    ];

    /* ---------------- 派生 ---------------- */
    const currentTitle = computed(() => turns.value[0]?.question || '新会话');
    const allArtifacts = computed(() => turns.value.flatMap((t) => t.artifacts || []));
    // 轨迹面板统计的是"调了什么工具"，思考节点不算
    const allTools = computed(() =>
      turns.value.flatMap((t) => (t.tools || []).filter((x) => x.kind !== 'think')));

    /* 轨迹按「轮次」分组：光看一串扁平的调用，读不出
       「这一问花了多久、走了几步」，而那才是用户关心的单位 */
    const roundsWithTools = computed(() =>
      turns.value
        .map((t, i) => {
          // 同一数组里混着思考节点，这里只要工具调用
          const tools = (t.tools || []).filter((x) => x.kind !== 'think');
          return {
            roundIndex: i,
            question: t.question,
            tools,
            totalMs: tools.reduce((s, x) => s + (x.ms || 0), 0),
          };
        })
        .filter((r) => r.tools.length));

    const stateCount = computed(() => {
      const c = { ok: 0, err: 0, warn: 0, wait: 0, cancel: 0, run: 0 };
      allTools.value.forEach((t) => { if (c[t.state] !== undefined) c[t.state]++; });
      return c;
    });

    const STATE_LABELS = {
      ok: '成功', err: '失败', warn: '被拒绝',
      wait: '待确认', cancel: '已取消', run: '执行中',
    };
    const stateLabel = (s) => STATE_LABELS[s] || s;

    // 左栏点轮次，滚到中栏对应位置
    const scrollToRound = (i) => {
      nextTick(() => {
        const el = document.getElementById('round-' + i);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    };

    /* 轨迹要能一眼看出「哪一步拖了后腿」，
       所以每条画一根相对条，基准取全场最慢的那一次调用 */
    const totalToolMs = computed(() =>
      allTools.value.reduce((sum, t) => sum + (t.ms || 0), 0));
    const maxToolMs = computed(() =>
      Math.max(1, ...allTools.value.map((t) => t.ms || 0)));

    /* ---------------- 工具函数 ---------------- */
    const escapeHtml = (s) => {
      const d = document.createElement('div');
      d.textContent = s ?? '';
      return d.innerHTML;
    };

    /* 成对的 ** 直接落成标签，绕开 CommonMark 的定界符判定。
       规范规定：闭合的 ** 前面若是标点，则后面必须也是空白或标点，
       否则不构成右定界符，整对星号会原样留在正文里。
       英文靠词间空格躲过一劫，中文没有空格——
       「这是**包含匹配（含组合状态）**的口径」里的 ** 前面是「）」、
       后面是「的」，正是那个被判无效的组合。
       实测 markdown-it 表现完全相同，这是规范行为而非 marked 的缺陷。
       代码块和行内代码里的星号是字面量，不参与替换。 */
    const strongify = (text) => {
      const s = String(text ?? '');
      if (!s.includes('**')) return s;

      /* 前后都要求不是星号，这样 ****甲**** 这类嵌套写法会整个跳过，
         交回 marked 按原样解析成嵌套 strong，而不是被切歪 */
      const pair = (seg) => seg.replace(
        /(?<!\*)\*\*(?=[^\s*])([\s\S]*?[^\s*])\*\*(?!\*)/g,
        '<strong>$1</strong>',
      );

      // 按 ``` 切段，奇数下标是围栏代码块，原样保留
      const fences = s.split('```');
      for (let i = 0; i < fences.length; i += 2) {
        // 行内代码不跨行，逐行按 ` 切格，奇数下标是代码
        fences[i] = fences[i].split('\n').map((line) => {
          const cells = line.split('`');
          for (let j = 0; j < cells.length; j += 2) cells[j] = pair(cells[j]);
          return cells.join('`');
        }).join('\n');
      }
      return fences.join('```');
    };

    const md = (text) => {
      try { return marked.parse(strongify(text)); }
      catch (e) { return escapeHtml(text); }
    };

    const safeParse = (raw) => {
      try { return JSON.parse(raw); } catch (e) { return null; }
    };

    const prettyJson = (obj) => {
      try { return JSON.stringify(obj, null, 2); } catch (e) { return String(obj); }
    };

    const highlightSql = (sql) => {
      const re = new RegExp('\\b(' + SQL_WORDS.join('|') + ')\\b', 'gi');
      return escapeHtml(sql).replace(re, '<span class="kw">$1</span>');
    };

    const fmtVal = (v) => {
      if (v === null || v === undefined) return '—';
      if (typeof v === 'object') return prettyJson(v);
      return String(v);
    };

    const shortTime = (iso) => {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      const pad = (n) => String(n).padStart(2, '0');
      const hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
      if (d.toDateString() === new Date().toDateString()) return hm;
      return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hm;
    };

    const toolGist = (tool) => {
      const p = tool.parsed;
      if (p) {
        if (p.row_count != null) return p.row_count + ' 行';
        if (p.answer) return String(p.answer).slice(0, 70);
        if (p.message) return String(p.message).slice(0, 70);
      }
      const a = tool.args || {};
      const v = a.question || a.filter_question || '';
      return v ? String(v).slice(0, 70) : '';
    };

    /* 思考节点的唯一构造入口。实时推送和历史回放都从这里出——
       两条路径各写一份的话，迟早会漂移成一个有 round 一个没有、
       一个有 open 一个没 open，界面上就长得不一样了 */
    const makeThinkNode = (round, text) => ({
      kind: 'think',
      round: round ?? null,
      text: text || '',
      open: false,
    });

    /* 折叠状态下的一行预览。思维链开头多是"我们需要…"这类套话，
       信息量不高，但至少能让人判断值不值得展开 */
    const thinkGist = (text) =>
      String(text || '').replace(/\s+/g, ' ').trim().slice(0, 70);

    const confirmColumns = (c) => (c.rows && c.rows.length ? Object.keys(c.rows[0]) : []);
    const confirmTitle = (c) => {
      if (!c.resolved) return c.scope + ' · 等待确认';
      return c.scope + ' · ' + (c.cancelled ? '已取消' : '已执行');
    };

    /* ---------------- 确认卡片构造 ---------------- */
    const candidateRows = (list) =>
      list.map((c) => ({
        '项目名称': c.project_name,
        '负责人': c.owner || '—',
        '状态': c.status_raw || '—',
      }));

    const buildConfirm = (pending) => {
      const type = pending.type;
      const base = { resolved: false, verdict: '', rows: [], diffs: null, verb: '确认' };

      if (type === 'delete') {
        const n = pending.candidates.length;
        return Object.assign(base, {
          scope: '删除 ' + n + ' 条记录',
          verb: '确认删除',
          danger: true,
          rows: candidateRows(pending.candidates),
          note: '确认后这 ' + n + ' 条进入回收站，7 天内可恢复。',
        });
      }

      if (type === 'restore') {
        const n = pending.candidates.length;
        return Object.assign(base, {
          scope: '恢复 ' + n + ' 条记录',
          verb: '确认恢复',
          rows: candidateRows(pending.candidates),
          note: '确认后这 ' + n + ' 条重新回到项目台账。',
        });
      }

      if (type === 'create') {
        const r = pending.record;
        return Object.assign(base, {
          scope: '新增 1 条记录',
          verb: '确认新增',
          rows: [{
            '项目名称': r.project_name,
            '负责人': r.owner || '—',
            '分类': r.category || '—',
            '状态': r.status_raw || '已提交',
            '下发时间': r.issued_date || '今天',
          }],
          note: '确认后写入台账。',
        });
      }

      if (type === 'batch_create') {
        const n = pending.records.length;
        return Object.assign(base, {
          scope: '批量新增 ' + n + ' 条记录',
          verb: '确认新增',
          rows: candidateRows(pending.records),
          note: '确认后这 ' + n + ' 条写入台账。',
        });
      }

      if (type === 'update') {
        const n = pending.candidates.length;
        const first = pending.candidates[0] || {};
        const diffs = Object.entries(pending.updates || {}).map(([k, v]) => ({
          field: FIELD_LABELS[k] || k,
          from: n === 1 ? fmtVal(first[k]) : '（' + n + ' 条各不相同）',
          to: fmtVal(v),
        }));
        return Object.assign(base, {
          scope: '修改 ' + n + ' 条记录',
          verb: '确认修改',
          rows: pending.candidates.map((c) => ({
            '项目名称': c.project_name,
            '负责人': c.owner || '—',
            '当前状态': c.status_raw || '—',
          })),
          diffs,
          note: '确认后立即写入台账。',
        });
      }

      if (type === 'import') {
        const s = pending.scan_result || {};
        const count = (k) => (s[k] ? s[k].length : 0);
        return Object.assign(base, {
          scope: 'Excel 导入',
          verb: '确认导入',
          rows: [
            { '类别': '新增记录', '条数': count('new_records'), '说明': '文件里有、台账里没有' },
            { '类别': '字段冲突', '条数': count('conflicts'), '说明': '同名记录字段对不上' },
            { '类别': '已删除待恢复', '条数': count('deleted_in_db'), '说明': '台账里是删除态、文件里又出现' },
            { '类别': '文件缺失', '条数': count('missing_from_excel'), '说明': '台账里有、文件里没有（不影响）' },
          ],
          note: '默认口径：新增全部导入，冲突以台账为准，已删除的保持删除。'
              + '要改口径请直接在输入框说明，例如「导入，并恢复已删除的记录」。',
        });
      }

      return Object.assign(base, {
        scope: '需要确认',
        verb: '确认',
        note: pending.message || '',
      });
    };

    /* ---------------- 设置 ---------------- */
    const allGroups = computed(() => [
      LOCAL_GROUPS[0],
      ...(settings.value.groups || []).map((g) => ({ ...g, local: false })),
      LOCAL_GROUPS[1],
      LOCAL_GROUPS[2],
    ]);

    const isLocalGroup = computed(() => {
      const g = allGroups.value.find((x) => x.id === activeGroup.value);
      return !!(g && g.local);
    });

    const activeGroupParams = computed(() => {
      if (isLocalGroup.value) return [];
      return (settings.value.params || []).filter((p) => p.group === activeGroup.value);
    });

    const activeGroupDesc = computed(() => {
      const g = allGroups.value.find((x) => x.id === activeGroup.value);
      return g ? (g.desc || g.name) : '';
    });

    const dirty = (key) => draft.value[key] !== undefined;

    const groupDirty = (gid) => {
      return (settings.value.params || [])
        .filter((p) => p.group === gid && draft.value[p.key] !== undefined)
        .length;
    };

    const dirtyCount = computed(() => Object.keys(draft.value).length);

    // 密码框永不回填：留空 = 不修改，避免把掩码当成真值提交上去
    const editValue = (p) => {
      if (p.type === 'password') return draft.value[p.key] ?? '';
      return draft.value[p.key] ?? p.value;
    };

    const onEdit = (p, v) => {
      if (String(v) === String(p.value)) {
        delete draft.value[p.key];      // 改回原样就当没改过
      } else {
        draft.value[p.key] = v;
      }
    };

    const resetField = (p) => { draft.value[p.key] = p.default; };

    const discardDraft = () => { draft.value = {}; saveMsg.value = null; };

    watch(advanced, (v) => localStorage.setItem('dp_advanced', v ? '1' : '0'));

    const flash = (text, ok = true) => {
      saveMsg.value = { text, ok };
      setTimeout(() => { saveMsg.value = null; }, 3200);
    };

    /* 全局提示条：替代 alert()。原生的会阻断操作、样式脱离界面，
       按钮文案还跟随系统语言 */
    const toast = ref(null);
    let toastTimer = null;

    const notify = (text, ok = true) => {
      toast.value = { text, ok };
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.value = null; }, ok ? 2600 : 4200);
    };

    const loadSettings = async () => {
      try {
        const res = await fetch(API + '/settings');
        if (res.ok) settings.value = await res.json();
      } catch (e) { /* 静默 */ }
    };

    const goSettings = async () => {
      draft.value = {};
      saveMsg.value = null;
      confirmKind.value = null;
      view.value = 'settings';
      await Promise.all([loadSettings(), loadCounts()]);
    };

    const goChat = () => {
      draft.value = {};
      view.value = 'chat';
    };

    const saveSettings = async () => {
      if (!dirtyCount.value || saving.value) return;
      saving.value = true;
      try {
        const values = {};
        for (const [k, v] of Object.entries(draft.value)) {
          const p = (settings.value.params || []).find((x) => x.key === k);
          // 密码框留空 = 不改这一项，别把空串当成新密码写进去
          if (p && p.type === 'password' && String(v).trim() === '') continue;
          values[k] = v;
        }
        if (!Object.keys(values).length) { draft.value = {}; return; }

        const res = await fetch(API + '/settings', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ values }),
        });
        const data = await res.json();
        if (!res.ok) { flash(data.detail || '保存失败', false); return; }

        draft.value = {};
        await loadSettings();
        notify('已保存并生效');
      } catch (e) {
        flash('保存失败：' + e.message, false);
      } finally {
        saving.value = false;
      }
    };

    /* ---------------- 数据加载 ---------------- */
    const loadSessions = async () => {
      try {
        const res = await fetch(API + '/sessions');
        if (res.ok) sessions.value = (await res.json()).sessions || [];
      } catch (e) { /* 静默 */ }
    };


    /* ---------------- 滚动 ---------------- */
    const scrollDown = async () => {
      await nextTick();
      const el = streamEl.value;
      if (el) el.scrollTop = el.scrollHeight;
    };

    /* ---------------- 事件处理 ---------------- */
    const collectArtifact = (turn, tool) => {
      const p = tool.parsed;
      if (!p || !p.file_path) return;
      const path = String(p.file_path).replace(/\\/g, '/');
      const name = path.split('/').pop();
      const isPdf = name.toLowerCase().endsWith('.pdf');
      turn.artifacts.push({
        name,
        path: p.file_path,
        kind: isPdf ? 'pdf' : 'xlsx',
        rows: p.row_count != null ? p.row_count : null,
        label: isPdf ? 'PDF 报告' : 'Excel 表格',
      });
    };

    const handleEvent = (ev, turn) => {
      switch (ev.type) {
        case 'start':
          sessionId.value = ev.session_id;
          localStorage.setItem('dp_session', ev.session_id);
          break;

        case 'think':
          turn.stage = ev.round === 1 ? '正在理解你的问题…' : '正在整理结果…';
          break;

        case 'reasoning':
          // 思考节点也进 tools 数组：界面要的是「先想后做」的时间线，
          // 单独存一份再合并，反而要多一层结构和一个排序步骤
          turn.tools.push(makeThinkNode(ev.round, ev.text));
          break;

        case 'compact':
          turn.stage = ev.message;
          break;

        case 'tool_call':
          turn.stage = '';
          turn.tools.push({
            callId: ev.call_id,
            name: ev.name,
            args: ev.args || {},
            state: 'run',
            open: false,
            ms: null,
            raw: '',
            parsed: null,
          });
          break;

        case 'tool_result': {
          const tool = turn.tools.find((t) => t.callId === ev.call_id);
          if (!tool) break;
          tool.ms = ev.elapsed_ms;
          tool.raw = ev.raw || '';
          tool.parsed = safeParse(tool.raw);
          tool.state = ev.security ? 'warn' : (ev.ok ? 'ok' : 'err');
          collectArtifact(turn, tool);
          break;
        }

        case 'pending':
          turn.stage = '';
          // 触发确认的那个工具没返回结果，停在"待确认"而不是一直转
          turn.tools.forEach((t) => { if (t.state === 'run') t.state = 'wait'; });
          turn.confirm = buildConfirm(ev.pending);
          break;

        case 'answer':
          turn.answer = ev.content || '';
          break;

        case 'error':
          turn.answer = '**出错了**\n\n' + ev.message;
          break;

        case 'done':
          lastElapsed.value = ev.elapsed_ms;
          break;
      }
    };

    /* ---------------- 流式请求 ---------------- */
    const runStream = async (question, turn) => {
      busy.value = true;
      turn.stage = '正在处理…';

      try {
        const res = await fetch(API + '/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question, session_id: sessionId.value || null }),
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });

          const chunks = buf.split('\n\n');
          buf = chunks.pop();

          for (const chunk of chunks) {
            const line = chunk.trim();
            if (!line.startsWith('data:')) continue;
            let ev;
            try {
              ev = JSON.parse(line.slice(5).trim());
            } catch (e) {
              // 静默跳过会让问题极难查：事件没了，界面停在加载态，
              // 控制台却干干净净。至少留下痕迹
              console.warn('[SSE] 事件解析失败，已跳过：', e.message,
                           line.slice(0, 200));
              continue;
            }
            handleEvent(ev, turn);
            await scrollDown();
          }
        }
      } catch (e) {
        turn.answer = '**连接中断**：' + e.message;
      } finally {
        turn.stage = '';
        busy.value = false;
        await scrollDown();
        loadSessions();
      }
    };

    /* ---------------- 发送 ---------------- */
    const send = async () => {
      const q = input.value.trim();
      if (!q || busy.value) return;

      turns.value.push({ question: q, tools: [], artifacts: [], answer: '', stage: '' });

      /* 必须从 turns.value 取回代理再往下传。
         Vue 3 的 ref 只在「通过 proxy 访问」时返回响应式代理，
         直接持有并修改原始对象不经过 Proxy 的 set 陷阱——
         事件流里那些 turn.artifacts.push() / turn.answer = 就全都悄悄丢了，
         界面要等下一次无关的响应式变更才碰巧更新，看起来就是「得按 F5」 */
      const turn = turns.value[turns.value.length - 1];

      input.value = '';
      resetInputHeight();
      await scrollDown();

      await runStream(q, turn);
    };

    const ask = (q) => {
      if (busy.value) return;
      input.value = q;
      send();
    };

    const answerConfirm = async (ti, text) => {
      const turn = turns.value[ti];
      if (!turn || !turn.confirm || busy.value) return;

      const cancelled = text === '取消';
      turn.confirm.resolved = true;
      turn.confirm.cancelled = cancelled;
      turn.confirm.verdict = cancelled ? '已取消，未执行任何操作' : '正在执行…';

      // 取消掉的那个工具不会再有结果回来，别让它永远停在「待确认」
      if (cancelled) {
        turn.tools.forEach((t) => { if (t.state === 'wait') t.state = 'cancel'; });
      }

      await runStream(text, turn);

      // 卡片里直接给结论，answer 就不再单独渲染了
      turn.confirm.verdict = turn.answer || (cancelled ? '已取消，未执行任何操作' : '已执行');
    };


    /* ---------------- 输入框 ---------------- */
    const autoGrow = (e) => {
      const el = e.target;
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 168) + 'px';
    };

    const resetInputHeight = () => {
      nextTick(() => {
        const el = document.querySelector('.composer textarea');
        if (el) el.style.height = 'auto';
      });
    };

    const setTheme = (t) => {
      theme.value = t;
      localStorage.setItem('dp_theme', t);
      document.documentElement.setAttribute('data-theme', t);
    };

    const toggleRail = () => {
      railOpen.value = !railOpen.value;
      localStorage.setItem('dp_rail', railOpen.value ? '1' : '0');
    };

    /* ---------------- 会话 ---------------- */
    /* 回看历史会话时，把当时走过的工具一并还原。
       否则「导出了 Excel」这类会话打开后，右栏产物是空的——
       数据一直在 dp_tools 里，只是以前没收 */
    const messagesToTurns = (messages) => {
      const out = [];
      let cur = null;
      for (const m of messages) {
        if (m.role === 'user') {
          cur = { question: m.content, tools: [], artifacts: [], answer: '', stage: '' };
          out.push(cur);
        } else if (m.role === 'assistant' && cur) {
          cur.answer = m.content;

          // 思考链和工具是两条独立记录，各自带轮次，合起来按轮次排。
          // 直接全堆在前面的话，回放出来的顺序会和实时看到的不一样
          const timeline = [
            ...(m.dp_reasonings || []).map((r) => ({ kind: 'think', round: r.round, src: r })),
            ...(m.dp_tools || []).map((t) => ({ kind: 'tool', round: t.round, src: t })),
          ];
          // sort 在现代 JS 里是稳定的，同轮次内 think 排在 tool 之前
          timeline.sort((a, b) => (a.round ?? 0) - (b.round ?? 0));

          for (const item of timeline) {
            if (item.kind === 'think') {
              cur.tools.push(makeThinkNode(item.round, item.src.text));
              continue;
            }
            const t = item.src;
            const tool = {
              callId: '',
              name: t.name,
              args: t.args || {},
              state: t.security ? 'warn' : (t.ok ? 'ok' : 'err'),
              open: false,
              ms: t.ms,
              raw: t.raw || '',
              parsed: safeParse(t.raw),
            };
            cur.tools.push(tool);
            collectArtifact(cur, tool);
          }
        }
      }
      return out;
    };

    const openSession = async (id, silent) => {
      if (busy.value) return;
      try {
        const res = await fetch(API + '/sessions/' + id);
        if (!res.ok) {
          if (!silent) notify('这个会话已经不在了', false);
          return;
        }
        const data = await res.json();
        sessionId.value = id;
        localStorage.setItem('dp_session', id);
        turns.value = messagesToTurns(data.messages || []);
        await scrollDown();
      } catch (e) {
        if (!silent) notify('读取会话失败：' + e.message, false);
      }
    };

    const newSession = () => {
      if (busy.value) return;
      sessionId.value = '';
      localStorage.removeItem('dp_session');
      turns.value = [];
      viewer.value = null;
    };

    /* 删除单个会话用二次点击，不用浏览器弹窗。
       左栏窄，塞不下内联确认条；而原生弹窗突兀，
       按钮文案还跟随系统语言，跟界面完全脱节 */
    const pendingDelete = ref(null);
    let pendingTimer = null;

    const removeSession = async (id) => {
      if (pendingDelete.value !== id) {
        pendingDelete.value = id;
        clearTimeout(pendingTimer);
        // 3 秒不点就自动收回，避免悬在半空
        pendingTimer = setTimeout(() => { pendingDelete.value = null; }, 3000);
        return;
      }
      clearTimeout(pendingTimer);
      pendingDelete.value = null;
      try { await fetch(API + '/sessions/' + id, { method: 'DELETE' }); } catch (e) {}
      if (id === sessionId.value) newSession();
      loadSessions();
    };

    /* ---------------- 文件 ---------------- */
    const download = (path, name) => {
      const a = document.createElement('a');
      a.href = API + '/download?path=' + encodeURIComponent(path);
      a.download = name;
      a.click();
    };

    /* 预览开在对话区里分屏，不再弹浮层。
       浮层会盖住对话——用户在核对表格时往往正需要看旁边的对话 */
    const previewFile = async (f) => {
      try {
        const res = await fetch(API + '/preview?path=' + encodeURIComponent(f.path));
        if (!res.ok) { notify('无法预览这个文件', false); return; }
        const data = await res.json();

        if (data.type === 'excel') {
          viewer.value = {
            name: f.name, path: f.path, kind: 'xlsx',
            columns: data.columns, rows: data.rows, total: data.total_rows,
          };
        } else if (data.type === 'pdf') {
          viewer.value = { name: f.name, path: f.path, kind: 'pdf', url: data.url };
        } else {
          // 不支持预览的类型不再偷偷下载，明说
          viewer.value = { name: f.name, path: f.path, kind: 'other' };
        }
      } catch (e) {
        notify('预览失败：' + e.message, false);
      }
    };

    const upload = async (file) => {
      if (!file) return;
      const fd = new FormData();
      fd.append('file', file);
      try {
        const res = await fetch(API + '/upload', { method: 'POST', body: fd });
        const data = await res.json();
        if (!res.ok) { notify('上传失败：' + (data.detail || '未知错误'), false); return; }

        turns.value.push({
          question: '上传文件：' + file.name,
          tools: [], artifacts: [], stage: '',
          answer: '已上传到 `' + data.path + '`\n\n现在可以说「从 ' + data.path + ' 导入数据」。',
        });
        await scrollDown();
      } catch (e) {
        notify('上传失败：' + e.message, false);
      }
    };

    const triggerUpload = () => fileInput.value && fileInput.value.click();

    const handleFileSelect = async (e) => {
      const file = e.target.files && e.target.files[0];
      e.target.value = '';            // 同一个文件连选两次也要能触发
      await upload(file);
    };

    const onDrop = async (e) => {
      dragging.value = false;
      const file = e.dataTransfer.files[0];
      await upload(file);
    };

    const dragLeave = (e) => {
      if (!e.currentTarget.contains(e.relatedTarget)) dragging.value = false;
    };

    /* 维护组的危险操作：内联二次确认，不用浏览器原生弹窗 */
    const confirmKind = ref(null);
    const fileCount = ref(null);

    const loadCounts = async () => {
      try {
        const res = await fetch(API + '/files');
        if (res.ok) fileCount.value = ((await res.json()).files || []).length;
      } catch (e) { /* 静默 */ }
    };

    const doClearFiles = async () => {
      confirmKind.value = null;
      try {
        const res = await fetch(API + '/files', { method: 'DELETE' });
        const data = await res.json();
        notify('已清空 ' + data.deleted + ' 个文件');
        loadCounts();
      } catch (e) {
        flash('清空失败：' + e.message, false);
      }
    };

    const doClearSessions = async () => {
      confirmKind.value = null;
      for (const s of sessions.value) {
        try { await fetch(API + '/sessions/' + s.session_id, { method: 'DELETE' }); } catch (e) {}
      }
      newSession();
      loadSessions();
      notify('已删除全部会话');
    };

    /* ---------------- 开机动画 ---------------- */
    const countUp = (el, target, duration, pad) => {
      const start = performance.now();
      const step = (now) => {
        const p = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - p, 3);
        const v = Math.round(target * eased);
        el.textContent = pad ? String(v).padStart(pad, '0') : String(v);
        if (p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    };

    /* 开机动画的三格改报日期。
       这不是随手换的填充物：DataPilot 要处理「上周」「本月」这类相对时间，
       agent 的 SYSTEM_PROMPT 里也带着当前日期。开机时把时间基准亮出来，
       是在告诉用户这台机器按哪一天算 */
    const renderBootStats = () => {
      const host = document.getElementById('bootStats');
      if (!host) return;

      const now = new Date();
      const cells = [
        { n: now.getFullYear(), label: '年', pad: 0 },
        { n: now.getMonth() + 1, label: '月', pad: 2 },
        { n: now.getDate(),       label: '日', pad: 2 },
      ];

      /* 三格依次滚入。窗口跟航迹弧旋转、北方亮起严格同起同止：
         900ms 起，最后一格收在 2400ms（900 + 2×280 + 940）。
         改这三个数必须同步改 tip-stay 和 sleep 的下限 */
      const START = 900, STEP = 280, DURATION = 940;

      host.innerHTML = cells.map((c, i) =>
        '<div class="boot-stat" style="animation-delay:' +
        ((START + i * STEP) / 1000) + 's">' +
        '<b>' + (c.pad ? '00' : '0') + '</b><span>' + c.label + '</span></div>'
      ).join('');

      const nums = host.querySelectorAll('.boot-stat b');
      cells.forEach((c, i) => {
        setTimeout(() => countUp(nums[i], c.n, DURATION, c.pad), START + i * STEP);
      });
    };

    const boot = async () => {
      const skip = document.documentElement.getAttribute('data-boot') === 'skip';
      const bar = document.getElementById('bootBar');
      const started = Date.now();

      // 动画期间做真实初始化，不是白等
      if (!skip && bar) bar.style.width = '34%';
      renderBootStats();

      await loadSessions();

      if (!skip && bar) bar.style.width = '100%';

      if (skip) return;

      // 最短展示时长。2.40s 是三方共同收尾的那一刻——
      // 航迹弧转完一圈半停下、日期末格滚完、北方指针亮起。
      // 多留 100ms 让「锁定」这个瞬间被看到，再开始淡出
      await sleep(Math.max(0, 2500 - (Date.now() - started)));

      // 用隐藏而不是 remove()：DOM 留着，调试动画时好复现
      const el = document.getElementById('boot');
      if (el) {
        el.classList.add('done');
        setTimeout(() => { el.style.display = 'none'; }, 820);
      }
      sessionStorage.setItem('dp_booted', '1');
    };

    /* ---------------- 挂载 ---------------- */
    onMounted(async () => {
      await boot();
      if (sessionId.value) await openSession(sessionId.value, true);
    });

    return {
      turns, input, busy, sessionId, sessions,
      rail, railOpen, leftShut, theme, viewer, dragging,
      view, settings, activeGroup, draft, advanced, saving, saveMsg,
      allGroups, isLocalGroup, activeGroupParams, activeGroupDesc,
      dirty, groupDirty, dirtyCount, editValue, onEdit, resetField,
      discardDraft, loadSettings, goSettings, goChat, saveSettings,
      lastElapsed, streamEl, samples, currentTitle, allArtifacts, allTools,
      totalToolMs, maxToolMs, leftTab, roundsWithTools, stateCount,
      stateLabel, scrollToRound,

      send, ask, answerConfirm,
      openSession, newSession, removeSession, pendingDelete,
      download, previewFile, upload, onDrop, dragLeave,
      fileInput, triggerUpload, handleFileSelect,
      confirmKind, fileCount, doClearFiles, doClearSessions,
      toast, notify,
      autoGrow, setTheme, toggleRail,
      md, escapeHtml, prettyJson, highlightSql, fmtVal, shortTime,
      toolGist, thinkGist, confirmColumns, confirmTitle,
    };
  },
}).mount('#app');
</script>
</body>
</html>
